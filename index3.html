<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Incan Gold - Deluxe Board Game</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Pridi:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-title: 'Chakra Petch', sans-serif;
      --font-body: 'Pridi', serif;

      /* ================= UI Icons & Background ================= */
      --bg-image: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792506434/background_tekkxm.jpg');
      --card-back-img: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577161/card-back_zr6j2h.jpg');
      
      --tent-icon-img: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577145/tent-icon_zthsuy.png');
      --img-bag-icon: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577092/Bag_w3sqer.jpg');
      --img-torch-icon: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577094/torch-icon_bf5f8d.png');
      
      /* ================= ภาพการ์ดวิหาร: ก่อนเปิด (ขาวดำ ไม่มีเลข) ================= */
      /* นำลิงก์รูปรอบ 1-5 แบบขาวดำมาใส่แทนที่ลิงก์ Placehold ด้านล่างนี้ครับ */
      --temple-unex-1: url('https://placehold.co/150x100/333/666?text=Unexplored+1');
      --temple-unex-2: url('https://placehold.co/150x100/333/666?text=Unexplored+2');
      --temple-unex-3: url('https://placehold.co/150x100/333/666?text=Unexplored+3');
      --temple-unex-4: url('https://placehold.co/150x100/333/666?text=Unexplored+4');
      --temple-unex-5: url('https://placehold.co/150x100/333/666?text=Unexplored+5');

      /* ================= ภาพการ์ดวิหาร: เปิดแล้ว (ภาพสี มีเลข) ================= */
      --temple-1: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577892/Round1_zujevj.png');
      --temple-2: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577888/Round2_kanmhs.png');
      --temple-3: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577886/Round3_svjdcy.png');
      --temple-4: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577883/Round4_uamafl.png');
      --temple-5: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577881/Round5_ec2tz6.png');

      /* ================= ภาพการ์ดสมบัติ ================= */
      --img-treasure-1: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577157/T1_m0xfvk.jpg');
      --img-treasure-2: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577124/T17_pu9zbs.jpg');
      --img-treasure-3: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577153/T3_krwcr5.jpg');
      --img-treasure-4: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577152/T4_eunsiz.jpg');
      --img-treasure-5: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577149/T5_ropje0.jpg');
      --img-treasure-7: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577133/T7_lkrjn2.jpg');
      --img-treasure-9: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577132/T9_vkghf7.jpg');
      --img-treasure-11: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577129/T11_uwfbmo.jpg');
      --img-treasure-13: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577148/T13_crnr6s.jpg');
      --img-treasure-14: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577128/T14_m5vf9i.jpg');
      --img-treasure-15: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577126/T15_p6anoe.jpg');
      --img-treasure-17: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577124/T17_pu9zbs.jpg');

      /* ================= ภาพการ์ดโบราณวัตถุ 5 ใบ ================= */
      --img-artifact-1: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577097/A2_jhahns.jpg');
      --img-artifact-2: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577097/A2_jhahns.jpg');
      --img-artifact-3: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577139/A3_vssc4a.jpg');
      --img-artifact-4: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577095/A4_mkk38l.jpg');
      --img-artifact-5: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577093/A5_ktydo5.jpg');

      /* ================= ภาพการ์ดกับดัก 5 ชนิด ================= */
      --img-hazard-spider: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577104/TT1_vb3tzd.jpg');
      --img-hazard-snake: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577104/TT1_vb3tzd.jpg');
      --img-hazard-fire: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577100/TT3_nbjg3b.jpg');
      --img-hazard-rock: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577141/TT4_gpnu28.jpg');
      --img-hazard-mummy: url('https://res.cloudinary.com/dh6wsulnr/image/upload/v1792577143/TT5_p2qfkh.jpg');
      
      /* Colors */
      --panel: rgba(25, 28, 43, 0.95);
      --border-gold: #d4af37;
      --gold: #f59e0b;
      --ruby: #ef4444;
      --emerald: #10b981;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
    body { background-image: var(--bg-image); background-size: cover; background-position: center; background-attachment: fixed; color: var(--text); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 10px; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 12, 18, 0.85); z-index: -1; }

    /* Layout */
    .game-layout { width: 100%; max-width: 1100px; display: none; gap: 15px; margin-top: 10px; }
    .main-column { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .side-column { width: 340px; display: flex; flex-direction: column; gap: 12px; }
    @media(max-width: 850px) { .game-layout { display: flex; flex-direction: column; } .side-column { width: 100%; } }

    /* Lobby */
    #lobbyScreen { width: 100%; max-width: 500px; display: flex; flex-direction: column; margin: auto; margin-top: 5vh; }
    .lobby-box { background: var(--panel); border: 2px solid var(--border-gold); border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .lobby-box h1 { font-family: var(--font-title); color: var(--gold); font-size: 2.8rem; margin-bottom: 20px; letter-spacing: 2px; }
    .input-group { display: flex; flex-direction: column; gap: 15px; text-align: left; margin-bottom: 25px; }
    .input-group label { font-family: var(--font-title); font-size: 1.1rem; color: var(--gold); }
    .input-group input, .input-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: rgba(15, 23, 42, 0.8); color: white; font-size: 1rem; }
    .btn-primary { font-family: var(--font-title); letter-spacing: 1px; background: linear-gradient(to bottom, #f59e0b, #d97706); color: #000; width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 1.3rem; font-weight: 700; cursor: pointer; transition: 0.1s; }
    .btn-primary:active { transform: scale(0.97); }

    /* Temple Round Cards */
    .temple-row { display: flex; justify-content: space-between; gap: 5px; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 12px; border: 1px solid #33384f; }
    .temple-card { 
      flex: 1; aspect-ratio: 3/2; background-size: cover; background-position: center; border-radius: 6px; 
      border: 1px solid #475569; opacity: 0.7; transition: 0.4s; position: relative;
    }
    .temple-card.active { 
      opacity: 1; border-color: var(--border-gold); box-shadow: 0 0 15px rgba(212,175,55,0.6); 
      transform: scale(1.05); z-index: 2;
    }
    .temple-card.past {
      opacity: 1; border-color: #5a6488;
    }
    
    /* Deck Tracker Panel */
    .deck-tracker { background: rgba(15, 17, 26, 0.9); border: 1px solid #475569; border-radius: 12px; padding: 12px; font-size: 0.9rem; font-family: var(--font-title); }
    .deck-header { display: flex; justify-content: space-between; color: var(--gold); font-size: 1.1rem; margin-bottom: 8px; border-bottom: 1px solid #33384f; padding-bottom: 5px; }
    .hz-grid { display: flex; justify-content: space-between; gap: 4px; font-size: 0.85rem; color: #cbd5e1; }
    .hz-item { background: rgba(255,255,255,0.05); padding: 4px 6px; border-radius: 6px; display: flex; align-items: center; gap: 4px; }
    
    /* Players Grid */
    .players-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    @media(max-width: 500px){ .players-grid { grid-template-columns: repeat(2, 1fr); } }
    
    .player-card { background: rgba(22, 24, 36, 0.9); border: 1px solid #33384f; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; position: relative; transition: 0.3s; }
    .player-card.you { border-color: var(--border-gold); box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }
    .player-card.escaped { opacity: 0.45; border-color: #3b82f6; }
    .p-header { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 700; align-items: center;}
    .p-status { font-family: var(--font-title); font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; }
    .status-in { background: rgba(16, 185, 129, 0.2); color: var(--emerald); }
    .status-camp { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .p-gems { font-family: var(--font-title); display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
    
    /* Icons in Player Card & Buttons */
    .tent-icon { display: inline-block; width: 22px; height: 22px; background-image: var(--tent-icon-img); background-size: contain; background-repeat: no-repeat; background-position: center; vertical-align: middle; margin-right: 4px; }
    .bag-icon { display: inline-block; width: 20px; height: 20px; background-image: var(--img-bag-icon); background-size: contain; background-repeat: no-repeat; background-position: center; vertical-align: middle; margin-right: 4px; }
    .btn-torch-icon { width: 45px; height: 45px; background-image: var(--img-torch-icon); background-size: contain; background-repeat: no-repeat; background-position: center; margin-bottom: 4px; }
    .btn-tent-icon { width: 45px; height: 45px; background-image: var(--tent-icon-img); background-size: contain; background-repeat: no-repeat; background-position: center; margin-bottom: 4px; }
    
    .float-text { font-family: var(--font-title); position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-weight: 700; font-size: 1.2rem; animation: floatUp 1.2s ease-out forwards; z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -30px) scale(1.3); } }

    /* Path Area */
    .path-section { background: rgba(15, 17, 26, 0.85); border: 1px solid #2e344d; border-radius: 14px; padding: 15px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 250px; }
    .path-header { display: flex; justify-content: space-between; font-family: var(--font-title); font-size: 1.1rem; font-weight: bold; }
    .cards-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 20px; align-items: center; perspective: 1200px; }
    .cards-scroll::-webkit-scrollbar { height: 8px; }
    .cards-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

    /* Cards */
    .card-wrapper { width: 115px; height: 165px; flex-shrink: 0; perspective: 1000px; }
    .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: 0.5s; transform: rotateY(180deg); }
    .card-inner.flipped { transform: rotateY(0deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; background-size: cover; background-position: center; border: 2px solid var(--border-gold); }
    .card-back { background-image: var(--card-back-img); transform: rotateY(180deg); border-color: #5a6488; }
    .card-front.hazard-card { border-color: var(--ruby); }
    .card-front.artifact-card { border-color: #38bdf8; }
    
    /* Leftover Badge */
    .card-leftover { font-family: var(--font-title); position: absolute; top: -8px; right: -8px; background: var(--gold); color: #000; font-size: 1rem; font-weight: 700; padding: 2px 10px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    .hazard-duplicate { animation: pulseWarn 0.6s infinite alternate; }
    @keyframes pulseWarn { from { box-shadow: 0 0 8px var(--ruby); transform: scale(1); } to { box-shadow: 0 0 20px var(--ruby); transform: scale(1.05); } }

    /* Controls */
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-card-btn { background: var(--panel); border: 2px solid #3b4261; padding: 10px; border-radius: 12px; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .action-card-btn:active { transform: scale(0.96); }
    .action-card-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-explore { border-color: var(--emerald); }
    .btn-return { border-color: #3b82f6; }
    .btn-act-title { font-family: var(--font-title); font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }

    /* Log Panel */
    .log-panel { background: rgba(17, 19, 29, 0.95); border: 1px solid #282c40; border-radius: 14px; padding: 12px; height: 100%; min-height: 300px; display: flex; flex-direction: column; }
    .log-panel h3 { font-family: var(--font-title); font-size: 1.2rem; color: var(--border-gold); margin-bottom: 10px; border-bottom: 1px solid #33384f; padding-bottom: 5px; }
    .log-box { flex: 1; overflow-y: auto; font-size: 0.95rem; display: flex; flex-direction: column; gap: 6px; }
    .log-entry { padding: 6px; border-radius: 6px; background: rgba(255,255,255,0.03); line-height: 1.5; }
    .log-alert { color: var(--ruby); font-weight: 700; }
    .log-gold { color: #fde047; font-weight: 700; }
    .log-art { color: #38bdf8; font-weight: 700; }

    /* Modal Summary */
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .modal-content { background: var(--panel); padding: 30px; border: 2px solid var(--border-gold); border-radius: 16px; text-align: center; width: 90%; max-width: 450px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
    .modal-content h2 { font-family: var(--font-title); color: var(--gold); margin-bottom: 20px; font-size: 2rem; }
    .rank-list { text-align: left; margin-bottom: 25px; display: flex; flex-direction: column; gap: 8px; }
    .rank-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; font-weight: bold; display: flex; justify-content: space-between; font-size: 1.1rem; }
    .rank-item span:last-child { font-family: var(--font-title); }
    .rank-1 { border: 1px solid var(--gold); background: rgba(245, 158, 11, 0.1); font-size: 1.2rem; }
  </style>
</head>
<body>
<div class="overlay"></div>

<!-- LOBBY SCREEN -->
<div id="lobbyScreen">
  <div class="lobby-box">
    <h1>Incan Gold</h1>
    <div class="input-group">
      <label>ชื่อนักสำรวจของคุณ:</label>
      <input type="text" id="playerNameInput" value="นักสำรวจ" maxlength="12">
      <label>จำนวนผู้เล่นบอท (AI):</label>
      <select id="botCountInput">
        <option value="2">2 บอท (เล่น 3 คน)</option>
        <option value="3">3 บอท (เล่น 4 คน)</option>
        <option value="4">4 บอท (เล่น 5 คน)</option>
        <option value="5">5 บอท (เล่น 6 คน)</option>
        <option value="6">6 บอท (เล่น 7 คน)</option>
        <option value="7" selected>7 บอท (เล่น 8 คน เต็มตี้)</option>
      </select>
    </div>
    <button class="btn-primary" onclick="startGame()">เริ่มผจญภัย</button>
  </div>
</div>

<!-- GAME SCREEN -->
<div class="game-layout" id="gameLayout">
  <!-- ฝั่งซ้าย: กระดานหลัก -->
  <div class="main-column">
    
    <div class="temple-row">
      <!-- ลบแอตทริบิวต์ style ออก ปล่อยให้ JS ควบคุมการสลับภาพเอง -->
      <div class="temple-card" id="tcard-1"></div>
      <div class="temple-card" id="tcard-2"></div>
      <div class="temple-card" id="tcard-3"></div>
      <div class="temple-card" id="tcard-4"></div>
      <div class="temple-card" id="tcard-5"></div>
    </div>

    <!-- แผงข้อมูลกองการ์ด (Deck Tracker) -->
    <div class="deck-tracker">
      <div class="deck-header">
        <span>🎴 การ์ดในกอง: <span id="deckCount">0</span> ใบ</span>
        <span>👑 วัตถุโบราณที่รอค้นพบ: <span id="artCount">0</span> ใบ</span>
      </div>
      <div class="hz-grid">
        <div class="hz-item">🕷️ <span id="hz-spider">3</span></div>
        <div class="hz-item">🐍 <span id="hz-snake">3</span></div>
        <div class="hz-item">🔥 <span id="hz-fire">3</span></div>
        <div class="hz-item">🪨 <span id="hz-rock">3</span></div>
        <div class="hz-item">🧟 <span id="hz-mummy">3</span></div>
      </div>
    </div>

    <div class="players-grid" id="playersGrid"></div>

    <div class="path-section">
      <div class="path-header">
        <span>ตกค้าง: <span id="pathRemainder" style="color:var(--gold);">0</span> 💎</span>
        <span id="dangerLevel">สภาวะ: ปลอดภัย</span>
      </div>
      <div class="cards-scroll" id="cardsScroll"></div>
    </div>

    <div id="controlsArea">
      <div class="action-row" id="decisionControls">
        <button class="action-card-btn btn-explore" id="exploreBtn" onclick="handleChoice('explore')">
          <div class="btn-torch-icon"></div>
          <span class="btn-act-title">ลุยต่อ</span>
        </button>
        <button class="action-card-btn btn-return" id="returnBtn" onclick="handleChoice('return')">
          <div class="btn-tent-icon"></div>
          <span class="btn-act-title">กลับเต็นท์</span>
        </button>
      </div>
      <button class="btn-primary" id="nextRoundBtn" style="display:none;" onclick="startNewRound()">เข้าสู่วิหารถัดไป ➡️</button>
    </div>
  </div>

  <!-- ฝั่งขวา: Log -->
  <div class="side-column">
    <div class="log-panel">
      <h3>บันทึกการเดินทาง</h3>
      <div class="log-box" id="logBox"></div>
    </div>
  </div>
</div>

<!-- MODAL SUMMARY -->
<div id="summaryModal" class="modal">
  <div class="modal-content">
    <h2>🏆 จบการสำรวจ 5 วิหาร</h2>
    <div class="rank-list" id="rankList"></div>
    <button class="btn-primary" onclick="location.reload()">เล่นใหม่อีกครั้ง 🔄</button>
  </div>
</div>

<script>
  /* --- Audio System --- */
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSFX(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    if(type === 'flip') {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(60, now+0.12);
      gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now+0.12);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now+0.12);
    } else if(type === 'gem') {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(1400, now);
      gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.4);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now+0.4);
    } else if(type === 'collapse') {
      const bs = audioCtx.sampleRate * 0.6; const buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
      const data = buf.getChannelData(0); for(let i=0; i<bs; i++) data[i] = Math.random()*2-1;
      const noise = audioCtx.createBufferSource(); noise.buffer = buf;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(400, now); filter.frequency.linearRampToValueAtTime(40, now+0.6);
      const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.7, now); gain.gain.linearRampToValueAtTime(0, now+0.6);
      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(); noise.stop(now+0.6);
    }
  }

  /* --- Game Constants --- */
  const TREASURE_VALS = [1, 2, 3, 4, 5, 5, 7, 7, 9, 11, 11, 13, 14, 15, 17];
  
  const HAZARD_TYPES = [
    { type: 'spider', name: 'แมงมุม', var: 'var(--img-hazard-spider)' }, 
    { type: 'snake', name: 'งูพิษ', var: 'var(--img-hazard-snake)' },
    { type: 'fire', name: 'ไฟ', var: 'var(--img-hazard-fire)' }, 
    { type: 'rock', name: 'หิน', var: 'var(--img-hazard-rock)' }, 
    { type: 'mummy', name: 'มัมมี่', var: 'var(--img-hazard-mummy)' }
  ];

  // Artifacts 1-5 (1-3 worth 5, 4-5 worth 10)
  const ALL_ARTIFACTS = [
    { id: 1, val: 5, var: 'var(--img-artifact-1)' },
    { id: 2, val: 5, var: 'var(--img-artifact-2)' },
    { id: 3, val: 5, var: 'var(--img-artifact-3)' },
    { id: 4, val: 10, var: 'var(--img-artifact-4)' },
    { id: 5, val: 10, var: 'var(--img-artifact-5)' }
  ];
  
  const BOT_PROFILES = [
    { n:'แดน', p:'daredevil' }, { n:'ลินดา', p:'cautious' }, { n:'โอเว่น', p:'smart' },
    { n:'ซาร่า', p:'greedy' }, { n:'แจ็ค', p:'chaotic' }, { n:'เอมมี่', p:'chill' }, { n:'เลโอ', p:'smart' }
  ];

  let players = [];
  let currentRound = 1;
  let deck = [];
  let currentPathCards = [];
  let pathRemainder = 0;
  let activeHazardsOnPath = [];
  let isRoundOver = false;

  let hazardCounts = { spider: 3, snake: 3, fire: 3, rock: 3, mummy: 3 };
  let activeArtifactsPool = []; 
  
  function startGame() {
    const pName = document.getElementById('playerNameInput').value || 'You';
    const botCount = parseInt(document.getElementById('botCountInput').value);

    players = [{ id: 0, name: pName, isAI: false, inTemple: true, bag: 0, chest: 0, profile: null }];
    let bots = [...BOT_PROFILES].sort(() => 0.5 - Math.random());
    for(let i=0; i<botCount; i++) {
      players.push({ id: i+1, name: bots[i].n, isAI: true, inTemple: true, bag: 0, chest: 0, profile: bots[i].p });
    }

    hazardCounts = { spider: 3, snake: 3, fire: 3, rock: 3, mummy: 3 };
    activeArtifactsPool = [];

    document.getElementById('lobbyScreen').style.display = 'none';
    document.getElementById('gameLayout').style.display = 'flex';
    
    currentRound = 1;
    startNewRound();
  }

  function startNewRound() {
    isRoundOver = false; currentPathCards = []; activeHazardsOnPath = []; pathRemainder = 0;
    players.forEach(p => { p.inTemple = true; p.bag = 0; });

    // เปลี่ยนภาพวิหาร ดำ/สี ตามเงื่อนไขรอบปัจจุบัน
    for(let i=1; i<=5; i++) {
      const tCard = document.getElementById(`tcard-${i}`);
      if(i < currentRound) {
        // รอบที่ผ่านไปแล้ว: โชว์รูปสี
        tCard.style.backgroundImage = `var(--temple-${i})`;
        tCard.className = 'temple-card past';
      } else if (i === currentRound) {
        // รอบปัจจุบัน: โชว์รูปสี + สว่างกรอบทอง
        tCard.style.backgroundImage = `var(--temple-${i})`;
        tCard.className = 'temple-card active';
      } else {
        // รอบที่ยังมาไม่ถึง: โชว์รูปขาวดำ (Unexplored)
        tCard.style.backgroundImage = `var(--temple-unex-${i})`;
        tCard.className = 'temple-card';
      }
    }

    if (currentRound <= 5) {
      activeArtifactsPool.push(ALL_ARTIFACTS[currentRound - 1]);
    }

    deck = [];
    TREASURE_VALS.forEach(v => {
      deck.push({ type: 'treasure', value: v, var: `var(--img-treasure-${v})` });
    });
    
    HAZARD_TYPES.forEach(h => {
      for(let i=0; i<hazardCounts[h.type]; i++) deck.push({ type: 'hazard', hType: h.type, name: h.name, var: h.var });
    });
    
    activeArtifactsPool.forEach(art => {
      deck.push({ type: 'artifact', artId: art.id, val: art.val, var: art.var });
    });
    
    deck = deck.sort(() => 0.5 - Math.random());

    document.getElementById('cardsScroll').innerHTML = ''; 
    document.getElementById('decisionControls').style.display = 'grid';
    document.getElementById('nextRoundBtn').style.display = 'none';
    
    updateUI();
    updateDeckTracker();
    log(`<b>เริ่มวิหารรอบที่ ${currentRound}/5</b>`);
    setTimeout(drawCard, 500);
  }

  function drawCard() {
    if(deck.length === 0) return;
    const card = deck.pop();
    currentPathCards.push(card);
    const idx = currentPathCards.length - 1;

    updateDeckTracker(); 
    playSFX('flip');
    renderCard(card, idx);
    setTimeout(() => processCard(card, idx), 500);
  }

  function renderCard(card, idx) {
    const sc = document.getElementById('cardsScroll');
    const w = document.createElement('div');
    w.className = 'card-wrapper'; w.id = `cWrap-${idx}`;

    let cClass = 'card-front', bgImg = card.var;
    if (card.type === 'hazard') cClass += ' hazard-card';
    else if (card.type === 'artifact') cClass += ' artifact-card';

    w.innerHTML = `
      <div class="card-inner" id="cIn-${idx}">
        <div class="card-back"></div>
        <div class="${cClass}" id="cFront-${idx}" style="background-image: ${bgImg};">
          <div class="card-leftover" id="cLoot-${idx}" style="display:none;"></div>
        </div>
      </div>
    `;
    sc.appendChild(w);
    sc.scrollLeft = sc.scrollWidth;
    requestAnimationFrame(() => setTimeout(() => { document.getElementById(`cIn-${idx}`).classList.add('flipped'); }, 50));
  }

  function showFloatVFX(playerId, text, color) {
    const pCard = document.getElementById(`player-${playerId}`);
    if(!pCard) return;
    const f = document.createElement('div');
    f.className = 'float-text'; f.style.color = color; f.innerText = text;
    pCard.appendChild(f);
    setTimeout(() => f.remove(), 1200);
  }

  function processCard(card, idx) {
    const inTemple = players.filter(p => p.inTemple);

    if (card.type === 'treasure') {
      const share = Math.floor(card.value / inTemple.length);
      const leftover = card.value % inTemple.length;
      pathRemainder += leftover;
      
      inTemple.forEach(p => {
        p.bag += share;
        if(share > 0) showFloatVFX(p.id, `+${share}`, '#10b981'); 
      });
      playSFX('gem');
      log(`💎 สมบัติ ${card.value} ได้คนละ <b>+${share}</b>`);
      
      if(leftover > 0) {
        const bdg = document.getElementById(`cLoot-${idx}`);
        if(bdg){ bdg.innerText = `+${leftover}`; bdg.style.display = 'block'; }
      }
    } 
    else if (card.type === 'hazard') {
      if (activeHazardsOnPath.includes(card.hType)) {
        document.getElementById(`cFront-${idx}`).classList.add('hazard-duplicate');
        playSFX('collapse');
        hazardCounts[card.hType] -= 1; 
        log(`<span class="log-alert">💥 วิหารถล่ม! กับดัก ${card.name} ออกซ้ำ (ถูกฉีกออกจากการเล่น 1 ใบ)</span>`);
        
        inTemple.forEach(p => { p.bag = 0; p.inTemple = false; showFloatVFX(p.id, '💔 แตก!', '#ef4444'); });
        
        updateUI(); updateDeckTracker(); endRound(); return;
      } else {
        activeHazardsOnPath.push(card.hType);
        log(`⚠️ เตือนภัย! เจอ ${card.name}`);
      }
    } 
    else if (card.type === 'artifact') {
      playSFX('gem');
      log(`<span class="log-art">👑 เจอโบราณวัตถุ (แต้ม: ${card.val})</span>`);
    }

    updateUI();
    if(!players[0].inTemple) {
      setTimeout(() => handleChoice('return'), 1000);
    } else {
      document.getElementById('exploreBtn').disabled = false;
      document.getElementById('returnBtn').disabled = false;
    }
  }

  function handleChoice(humanAction) {
    document.getElementById('exploreBtn').disabled = true; document.getElementById('returnBtn').disabled = true;

    const decisions = {};
    players.forEach(p => {
      if(!p.inTemple) return;
      decisions[p.id] = p.isAI ? calcBot(p) : humanAction;
    });

    const returners = players.filter(p => p.inTemple && decisions[p.id] === 'return');
    const continuers = players.filter(p => p.inTemple && decisions[p.id] === 'explore');

    if (returners.length > 0) {
      const sRem = Math.floor(pathRemainder / returners.length);
      pathRemainder = pathRemainder % returners.length;

      returners.forEach(p => {
        p.bag += sRem; p.chest += p.bag; p.inTemple = false;
        
        if(sRem > 0) showFloatVFX(p.id, `+${sRem} เก็บตก!`, '#f59e0b');
        log(`⛺ <b>${p.name.split(' ')[0]}</b> กลับเต็นท์ (เซฟ +${p.bag})`);
        p.bag = 0;
      });
      document.querySelectorAll('.card-leftover').forEach(e => e.style.display='none');

      if (returners.length === 1) {
        currentPathCards.forEach((c, i) => {
          if(c.type === 'artifact') {
            returners[0].chest += c.val;
            document.getElementById(`cWrap-${i}`).style.opacity = '0.3';
            showFloatVFX(returners[0].id, `✨ ได้วัตถุโบราณ!`, '#38bdf8');
            log(`<span class="log-art">✨ ${returners[0].name.split(' ')[0]} โฉบโบราณวัตถุไปคนเดียว! (+${c.val} แต้ม)</span>`);
            activeArtifactsPool = activeArtifactsPool.filter(a => a.id !== c.artId);
          }
        });
        currentPathCards = currentPathCards.filter(c => c.type !== 'artifact');
      }
    }

    updateUI();
    if(continuers.length === 0) { endRound(); } else { setTimeout(drawCard, 800); }
  }

  function calcBot(bot) {
    const prof = bot.profile;
    const hz = activeHazardsOnPath.length;
    const hasArt = currentPathCards.some(c => c.type === 'artifact');
    const inT = players.filter(p => p.inTemple).length;
    
    if(prof === 'chaotic') return Math.random() < 0.5 ? 'explore' : 'return';
    if(prof === 'chill') {
      if(hz >= 1 && bot.bag > 3) return 'return';
      return Math.random() < 0.6 ? 'explore' : 'return';
    }
    if(prof === 'smart') {
      if(hasArt && inT <= 2) return 'return';
      if(hz >= 2 && bot.bag >= 8) return 'return';
      if(hz >= 3) return Math.random() < 0.8 ? 'return' : 'explore';
      if(pathRemainder >= 4) return 'return';
      return 'explore';
    }
    if(prof === 'cautious') {
      if(hz >= 2) return 'return';
      if(bot.bag >= 6) return 'return';
      return 'explore';
    }
    if(prof === 'greedy') {
      if(hz >= 3 && bot.bag >= 15) return 'return';
      if(hz >= 4) return Math.random() < 0.6 ? 'return' : 'explore';
      return 'explore';
    }
    if(prof === 'daredevil') {
      if(hz >= 4) return Math.random() < 0.4 ? 'return' : 'explore';
      return 'explore';
    }
    return 'explore';
  }

  function endRound() {
    isRoundOver = true;
    document.getElementById('decisionControls').style.display = 'none';

    currentPathCards.forEach(c => {
      if(c.type === 'artifact') {
        activeArtifactsPool = activeArtifactsPool.filter(a => a.id !== c.artId);
        log(`<span class="log-alert">❌ โบราณวัตถุถูกฝังกลบในวิหาร สูญหายตลอดกาล!</span>`);
      }
    });

    if (currentRound >= 5) {
      setTimeout(showFinalScore, 1500);
    } else {
      currentRound++;
      document.getElementById('nextRoundBtn').style.display = 'block';
    }
  }

  function showFinalScore() {
    updateUI(true); 
    const s = [...players].sort((a,b) => b.chest - a.chest);
    const rList = document.getElementById('rankList');
    rList.innerHTML = '';
    s.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = `rank-item ${i===0 ? 'rank-1' : ''}`;
      el.innerHTML = `<span>#${i+1} ${p.name}</span> <span style="color:var(--gold);">${p.chest} 💎</span>`;
      rList.appendChild(el);
    });
    document.getElementById('summaryModal').style.display = 'flex';
  }

  function updateUI(revealTents = false) {
    document.getElementById('pathRemainder').innerText = pathRemainder;
    const dLevel = document.getElementById('dangerLevel');
    const hz = activeHazardsOnPath.length;
    dLevel.innerText = hz === 0 ? 'สภาวะ: ปลอดภัย' : `สภาวะ: เสี่ยง (${hz} ชนิด)`;
    dLevel.style.color = hz > 0 ? 'var(--ruby)' : 'var(--emerald)';

    const pg = document.getElementById('playersGrid');
    pg.innerHTML = '';
    players.forEach(p => {
      const c = document.createElement('div');
      c.className = `player-card ${p.id===0?'you':''} ${!p.inTemple?'escaped':''}`;
      c.id = `player-${p.id}`; 
      
      const tentStr = (p.id===0 || revealTents) ? p.chest : '?';
      c.innerHTML = `
        <div class="p-header"><span>${p.name.split(' ')[0]}</span> <span class="p-status ${p.inTemple?'status-in':'status-camp'}">${p.inTemple?'🏃 ลุย':'⛺ กลับ'}</span></div>
        <div class="p-gems">
          <span><span class="bag-icon"></span> <b style="color:#ffd166;">${p.bag}</b></span> 
          <span><span class="tent-icon"></span> <b>${tentStr}</b></span>
        </div>
      `;
      pg.appendChild(c);
    });
  }

  function updateDeckTracker() {
    document.getElementById('deckCount').innerText = deck.length;
    const artsInDeck = deck.filter(c => c.type === 'artifact').length;
    document.getElementById('artCount').innerText = artsInDeck;
    
    document.getElementById('hz-spider').innerText = hazardCounts['spider'];
    document.getElementById('hz-snake').innerText = hazardCounts['snake'];
    document.getElementById('hz-fire').innerText = hazardCounts['fire'];
    document.getElementById('hz-rock').innerText = hazardCounts['rock'];
    document.getElementById('hz-mummy').innerText = hazardCounts['mummy'];
  }

  function log(msg) {
    const box = document.getElementById('logBox');
    const d = document.createElement('div'); d.className = 'log-entry'; d.innerHTML = msg;
    box.prepend(d);
  }
</script>
</body>
